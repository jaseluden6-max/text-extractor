<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Text-from-Image Extractor</title>
  <!-- Load Tesseract.js via CDN -->
  <script src="https://jsdelivr.net"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    .container {
      background: #f9f9f9;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    input[type="file"] {
      margin: 20px 0;
      display: block;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    textarea {
      width: 100%;
      height: 200px;
      margin-top: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
      box-sizing: border-box;
      resize: vertical;
    }
    .status {
      font-style: italic;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Text from Image Extractor</h2>
    <p>Upload an image to scan and extract its text instantly inside your browser.</p>
    
    <input type="file" id="imageInput" accept="image/*">
    <button id="extractBtn" onclick="extractText()">Extract Text</button>
    
    <div id="statusUpdate" class="status"></div>
    
    <h3>Extracted Text:</h3>
    <textarea id="output" placeholder="Your extracted text will appear here..."></textarea>
  </div>

  <script>
    async function extractText() {
      const fileInput = document.getElementById('imageInput');
      const outputArea = document.getElementById('output');
      const statusUpdate = document.getElementById('statusUpdate');
      const button = document.getElementById('extractBtn');
      
      if (!fileInput.files || fileInput.files.length === 0) {
        alert('Please select an image file first.');
        return;
      }

      // UI updates during loading
      outputArea.value = '';
      statusUpdate.textContent = 'Initializing engine and processing image...';
      button.disabled = true;

      try {
        // Tesseract working process
        const result = await Tesseract.recognize(
          fileInput.files[0],
          'eng',
          { 
            logger: m => {
              if (m.status === 'recognizing text') {
                statusUpdate.textContent = `Progress: ${Math.round(m.progress * 100)}%`;
              }
            } 
          }
        );
        
        // Output text display
        outputArea.value = result.data.text;
        statusUpdate.textContent = 'Extraction complete!';
      } catch (error) {
        statusUpdate.textContent = 'An error occurred during extraction.';
        outputArea.value = 'Error detailed information: ' + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>

</body>
</html>

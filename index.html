<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI Chatbot</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 0 20px;
      background-color: #f5f7fb;
    }
    .chat-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 500px;
      overflow: hidden;
    }
    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      border-bottom: 1px solid #eee;
    }
    .message {
      margin-bottom: 15px;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .user-msg {
      background-color: #007bff;
      color: white;
      margin-left: auto;
    }
    .ai-msg {
      background-color: #e9ecef;
      color: #333;
    }
    .input-area {
      display: flex;
      padding: 15px;
      background: #fff;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 0 20px;
      margin-left: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #0056b3; }
    .config {
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
    }
    .config input { padding: 5px; flex: 1; }
  </style>
</head>
<body>

  <h2>My Public AI Chatbot</h2>
  
  <!-- API Key Input Field so you don't have to hardcode it publicly -->
  <div class="config">
    <input type="password" id="apiKey" placeholder="Paste your Gemini API Key here">
  </div>

  <div class="chat-container">
    <div class="chat-box" id="chatBox">
      <div class="message ai-msg">Hello! How can I help you today?</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');

    function appendMessage(text, isUser) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isUser ? 'user-msg' : 'ai-msg'}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const apiKey = document.getElementById('apiKey').value.trim();
      const messageText = input.value.trim();

      if (!messageText) return;
      if (!apiKey) {
        alert('Please paste your free Gemini API key first!');
        return;
      }

      // Show user message
      appendMessage(messageText, true);
      input.value = '';

      // Create "AI is thinking" placeholder
      const thinkingDiv = document.createElement('div');
      thinkingDiv.className = 'message ai-msg';
      thinkingDiv.textContent = 'Thinking...';
      chatBox.appendChild(thinkingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        // Call the free Google Gemini API
        const response = await fetch(`https://googleapis.com{apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: messageText }] }]
          })
        });

        const data = await response.json();
        chatBox.removeChild(thinkingDiv); // remove loading message

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const aiResponse = data.candidates[0].content.parts[0].text;
          appendMessage(aiResponse, false);
        } else {
          appendMessage('Error: Could not get a response from AI.', false);
        }
      } catch (error) {
        chatBox.removeChild(thinkingDiv);
        appendMessage('Error: Failed to connect to AI server.', false);
        console.error(error);
      }
    }
  </script>

</body>
</html>
